<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard project</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo">
          <h1>Kenyun</h1>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Settings</a></li>
          </ul>
        </nav>
      </aside>
      <main class="main-content">

          <h1>Welcome to your Dashboard.</h1>
        </header>
        <div class="statistic-card">
          <div class="card">
            <h2>Projects built</h2>
            <p class="stat-number">3</p>
            <p>This will be my fourth project.</p>
          </div>
          <div class="card">
            <h2>Github Uploads</h2>
            <p class="stat-number">3</p>
            <p>This will be the fourth project I upload to Github.</p>
          </div>
          <div class="card">
            <h2>Future Income Goal</h2>
            <p>$400MILLION</p>
            <p>This is a goal I want to eventually reach</p>
          </div>
      </main>
    </div>

</html>
